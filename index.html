<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Search Simulator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>File Search Simulator</h1>
    <p>Simulasi pencarian file berdasarkan nama dan ekstensi</p>
  </header>

  <main class="app-main">
    <!-- Area pencarian dan filter -->
    <section class="search-panel" aria-label="Pencarian file">
      <div class="form-group">
        <label for="search-input">Nama file</label>
        <input type="text" id="search-input" placeholder="Ketik nama file...">
      </div>

      <div class="form-group">
        <label for="extension-filter">Ekstensi</label>
        <select id="extension-filter">
          <option value="all">Semua</option>
          <option value="pdf">PDF</option>
          <option value="docx">DOCX</option>
          <option value="jpg">JPG</option>
          <option value="png">PNG</option>
          <option value="mp4">MP4</option>
        </select>
      </div>

      <div class="form-group">
        <label for="sort-select">Urutkan</label>
        <select id="sort-select">
          <option value="name">Nama</option>
          <option value="size">Ukuran</option>
          <option value="modifiedAt">Tanggal</option>
        </select>
      </div>
    </section>

    <!-- Area hasil pencarian -->
    <section class="result-panel" aria-label="Hasil pencarian">
      <p id="result-count" class="result-count"></p>
      <ul id="result-list" class="result-list"></ul>
      <p id="empty-message" class="empty-message" hidden>File tidak ditemukan.</p>
    </section>
  </main>

  <footer class="app-footer">
    <p>Reisya Heryadi &middot; NPM 257006111002 &middot; Informatika, Universitas Siliwangi</p>
  </footer>

  <script src="js/fileSystem.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
